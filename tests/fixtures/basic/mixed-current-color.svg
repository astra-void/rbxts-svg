<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- A fixed red backdrop plus a currentColor glyph: USES_CURRENT_COLOR is
       set but MONOCHROME is not, so this asset must never take the
       ImageColor3 tint path and its raster cache key must include the
       resolved currentColor. -->
  <rect x="2" y="2" width="20" height="20" fill="#ff0000"/>
  <path d="M6 10h12v4H6z" fill="currentColor"/>
</svg>
