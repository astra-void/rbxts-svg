name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run in flight for it pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are dead weight in CI and the dominant cost of the cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The Rust suites, clippy and rustfmt. Independent of Node entirely.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rust-toolchain.toml pins the channel and components.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The TypeScript surface: it has to build and typecheck on every platform the
  # native binary is published for, because the CLI and the transformer both do
  # real path handling and Windows is where that breaks.
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Debug: a release build with LTO costs minutes and buys nothing here.
      - run: pnpm run build:native:debug
      - run: pnpm run build:ts

      - run: pnpm run typecheck

      # Includes `check:lucide`, which fails if the committed icon output is
      # stale relative to the pinned lucide-static.
      - run: pnpm run test:node

  # The Luau suites, including the byte-exact comparison of the Luau rasterizer
  # against goldens generated by the Rust reference renderer.
  luau:
    name: Luau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Luau
        env:
          # Pinned: the goldens are byte-exact, so the interpreter is part of
          # the test environment. Bump deliberately.
          LUAU_VERSION: "0.734"
        run: |
          curl -fsSL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$HOME/.luau"
          chmod +x "$HOME/.luau/luau"
          echo "$HOME/.luau" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      # The Luau bundler reads the compiler through `packages/compiler/dist`,
      # which is the native binary, so both have to be built first.
      - run: pnpm run build:native:debug
      - run: pnpm run build:ts

      - run: pnpm run test:luau
